<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Explore Chris Antepenko’s interactive Unity demos.">
  <title>VR Portfolio — Demos</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #10171b; color: #edf3ee; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { max-width: 960px; margin: auto; padding: 72px 24px; }
    .eyebrow { color: #a9ccb6; font-size: .8rem; letter-spacing: .16em; text-transform: uppercase; }
    h1 { font-size: clamp(2.4rem, 7vw, 4rem); letter-spacing: -.05em; margin: 16px 0 40px; }
    ul { list-style: none; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 16px; }
    a { display: flex; justify-content: space-between; align-items: center; gap: 24px; min-height: 130px; padding: 28px; border: 1px solid #3b5147; border-radius: 12px; color: inherit; background: #1b2924; text-decoration: none; font-size: 1.3rem; }
    a:hover { background: #293d33; border-color: #a9ccb6; }
    a:focus-visible { outline: 3px solid #e7d28c; outline-offset: 4px; }
    a::after { content: '↗'; color: #e7d28c; font-size: 1.8rem; }
    #status { color: #adbdb4; font-size: .9rem; margin-top: 24px; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Chris Antepenko / VR Portfolio</p>
    <h1>Explore the demos.</h1>
    <ul id="projects" aria-label="Available demos">
      <!-- Keep existing demos accessible offline and without JavaScript. -->
      <li><a href="./demo1/index.html">Demo 1 · Carnival</a></li>
    </ul>
    <p id="status" role="status">Choose a demo to launch.</p>
  </main>
  <script>
    // Static hosts cannot enumerate directories. Discover project entry points
    // from this public repository instead; links always target this website.
    const repository = 'watswat5/VRPortfolio1Website';
    const branch = 'main';
    const titles = { demo1: 'Demo 1 · Carnival' };

    function projectPaths(tree) {
      return tree.filter(entry => entry.type === 'blob' &&
        entry.path.endsWith('/index.html') &&
        !entry.path.split('/').some(part => part.startsWith('.')))
        .map(entry => entry.path)
        .sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
    }

    async function discoverProjects() {
      const status = document.getElementById('status');
      try {
        const response = await fetch(
          `https://api.github.com/repos/${repository}/git/trees/${branch}?recursive=1`,
          { signal: AbortSignal.timeout(8000) }
        );
        if (!response.ok) throw new Error('Repository unavailable');
        const result = await response.json();
        if (result.truncated || !Array.isArray(result.tree)) throw new Error('Incomplete listing');
        const paths = projectPaths(result.tree);
        const items = paths.map(path => {
          const folder = path.slice(0, -'/index.html'.length);
          const link = document.createElement('a');
          link.href = './' + path.split('/').map(encodeURIComponent).join('/');
          link.textContent = titles[folder] || folder.replace(/[-_]/g, ' ').replace(/(\D)(\d)/g, '$1 $2');
          const item = document.createElement('li');
          item.append(link);
          return item;
        });
        document.getElementById('projects').replaceChildren(...items);
        status.textContent = paths.length ? 'Choose a demo to launch.' : 'No demos published yet.';
      } catch {
        status.textContent = 'Showing bundled demos. The latest project list is temporarily unavailable.';
      }
    }
    discoverProjects();
  </script>
</body>
</html>
